# Case studies: a weekly pick of the most inspiring design case studies of shipped work from well-known companies.
# To turn the page off, set enabled: false (the page then hides the tab).
# npm run cases prints what was kept and dropped, with the reason for each.

enabled: true
# Picks per week, at most. Fewer if fewer are good enough.
max_picks: 5
# The model scores each case 1-10 for how inspiring and instructive it is. Below this, it is dropped.
min_score: 7
# How far back each Monday's pick looks. Company design blogs post every few weeks, so two weeks, not one.
# A post is judged once, so nothing shows up twice.
window_days: 14

# Read every morning; posts are pooled between runs. All tested from the laptop's network in Nov 2026.
# Not used: Creative Review and Design Week block page readers (Design Week's feed is still read in full);
# Figma's blog pages load their text with JavaScript; Medium's case-study tags are mostly course projects;
# Spotify Design, Airbnb Design, Google Design and Uber Design have stopped posting or block readers.
feeds:
  # Company design and product teams
  - name: Microsoft Design
    url: https://microsoft.design/feed/
  - name: Slack Design
    url: https://slack.design/feed/
  - name: Discord
    url: https://discord.com/blog/rss.xml
  - name: Duolingo
    url: https://blog.duolingo.com/rss/
  - name: IBM Design
    url: https://medium.com/feed/design-ibm
  - name: Lyft Design
    url: https://medium.com/feed/lyft-design
  - name: Thumbtack Design
    url: https://medium.com/feed/thumbtack-design
  - name: Linear
