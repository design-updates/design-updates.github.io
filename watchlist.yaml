# RSS/Atom feeds, read every run. These are the most trusted source.
#   kind: company  the company's own feed; every item is about `app`
#   kind: outlet   a news site; items about a watchlist app, or with design words in the headline
#                  (redesign, rebrand, new logo, interface, onboarding...), go to the model
#   kind: design   a design or branding publication; every item goes to the model, which names the brand
#   page: PATTERN  the url is a newsroom web page, not a feed: its links whose path matches PATTERN (a regular
#                  expression) are the articles, and each is read for its title, date and summary
# `npm run check-feeds` tests every URL below.
#
# Also blocked or unusable (Nov 2026): DoorDash, Grubhub, Delivery Hero, foodpanda, Instacart, Noon, Careem, Deliveroo,
# Eurostar and Skyscanner newsrooms; Uber's newsroom (no article dates) and Zomato's blog (no article titles).
# Swiggy's blog is mostly restaurant lists, so it is left out. Those apps are covered by their store notes and outlets.
# Blocked for automated readers from the laptop's network (Nov 2026), even in a real Chrome: expedia.com (including
# its product release pages, expedia.com/product/release/...), Expedia Group's newsroom, Skyscanner, Omio, Trainline
# and PhocusWire. Their bigger releases reach the outlets below (Skift, The Verge, 9to5Mac, TechCrunch).
# Hopper's media center (media.hopper.com) reads fine but its articles carry no machine-readable date, so the
# 48-hour rule cannot check them; it is left out.
# X and LinkedIn have no free way to read posts (Nov 2026). Big design news posted there is usually
# picked up by the outlets and design publications below.
feeds:
  - name: Apple Developer News
    url: https://developer.apple.com/news/rss/news.rss
    kind: company
    app: Apple
  - name: Android Developers Blog
    url: https://feeds.feedburner.com/blogspot/hsDu
    kind: company
    app: Google
  - name: The Keyword (Android)
    url: https://blog.google/products/android/rss/
    kind: company
    app: Google
  - name: The Keyword (Travel)
    url: https://blog.google/products/travel/rss/
    kind: company
    app: Google Travel
  - name: Booking Holdings
    url: https://www.bookingholdings.com/feed/
    kind: company
    app: Booking.com
  - name: Booking.com Newsroom
    url: https://news.booking.com/feed/
    kind: company
    app: Booking.com
  - name: KAYAK News
    url: https://www.kayak.com/news/feed/
    kind: company
    app: Kayak
  - name: Tripadvisor Press
    url: https://tripadvisor.mediaroom.com/press-releases?pagetemplate=rss
    kind: company
    app: Tripadvisor
  # Newsrooms with no feed: the page itself is read, and links matching `page` are its articles.
  - name: Airbnb Newsroom
    url: https://news.airbnb.com/
    kind: company
    app: Airbnb
    page: '^/[a-z0-9]+(-[a-z0-9]+){2,}/?$'
  - name: Agoda Newsroom
    url: https://www.agoda.com/press/newsroom/
    kind: company
    app: Agoda
    page: '^/press/(?!agoda-in-the-news)[a-z0-9]+(-[a-z0-9]+){2,}/?$'
  - name: Trip.com Newsroom
