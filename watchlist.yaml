# Pixel Post: what to watch and where to look.
# Edit this file freely; no code changes needed. See README.md for details.
# Supported YAML: key: value, nested keys, "- " lists, [a, b] lists, # comments.

# Shown in the greeting ("Good morning, <reader>."). Leave empty for no name.
reader: ""
timezone: Asia/Shanghai

# Only items published within this many hours of the run are kept.
window_hours: 48

# Where the model calls go:
#   company    Trip.com's Coding Plan, signed in on this Mac with `ada cc`. Only works on the laptop. No web search.
#   gemini     Google's Gemini API, free tier (GEMINI_API_KEY). Google blocks it from mainland China, so it only
#              works on GitHub. No web search: Google Search is not free on current Gemini models.
#   anthropic  your own Anthropic API key (ANTHROPIC_API_KEY), with web search.
# Setting RADAR_PROVIDER overrides this; the GitHub workflows set it to gemini.
provider: company

company:
  curate: claude-gpt-6.1-sol[1M]  # requested 8 Nov 2026; gateway Responses API (not Messages)
  compare: claude-kr-gpt-5.6-luna[1M]  # smaller vision call that picks before/after images

# Version notes from the stores: catches design changes nobody announces. A new version whose notes
# mention design words (redesign, new look, layout...) goes to the model like a news item.
stores:
  app_store: true
  google_play: true
  country: us

gemini:
  curate: gemini-3.8-flash    # free tier; see ai.google.dev/gemini-api/docs/pricing

# Used when provider is anthropic.
models:
  curate: claude-sonnet-5-5   # the single filter-and-summarise call per run
  search: claude-haiku-5-5    # one web-search call per group below
  search_tool: web_search_20250305
  searches_per_group: 3       # max web searches the model may run per group
  max_candidates: 200         # cap on items sent to the curate call; design headlines are kept first

# USD per million tokens, used only to log an estimated cost per run.
# Check https://www.anthropic.com/pricing if these change.
prices:
  claude-sonnet-5-5: { input: 3, output: 15 }
  claude-haiku-5-5: { input: 1, output: 5 }
  gemini-3.8-flash: { input: 0, output: 0 }   # free tier; wrong if billing is turned on for the key's project
  web_search_per_1000: 10

# The five groups are also the five categories on the page: ota, rail, delivery, platform, consumer.
# Per app:
#   aliases      words that mark a headline as being about this app. Whole words, exact
#                capitals, so "Threads" matches the app but not "email threads".
#   domains      the company's own sites; items from these count as first-party
#   appstore_id  App Store id: the icon, and version notes for "changes nobody announces" (optional)
#   play_id      Google Play package name, for version notes (optional)
#   store_country  the App Store country the app is listed in, when it is not in `stores.country` (e.g. in, ae, cn)
