# Pixel Post: what to watch and where to look.
# Edit this file freely; no code changes needed. See README.md for details.
# Supported YAML: key: value, nested keys, "- " lists, [a, b] lists, # comments.

# Shown in the greeting ("Good morning, <reader>."). Leave empty for no name.
reader: ""
timezone: Asia/Shanghai

# Only items published within this many hours of the run are kept.
window_hours: 48

# Where the model calls go:
#   company    Trip.com's Coding Plan, signed in on this Mac with `ada cc`. Only works on the laptop. No web search.
#   gemini     Google's Gemini API, free tier (GEMINI_API_KEY). Google blocks it from mainland China, so it only
#              works on GitHub. No web search: Google Search is not free on current Gemini models.
#   anthropic  your own Anthropic API key (ANTHROPIC_API_KEY), with web search.
# Setting RADAR_PROVIDER overrides this; the GitHub workflows set it to gemini.
provider: company

company:
  curate: kr-claude-opus-5.5  # the model list is at aicoding.console.ctripcorp.com/admin/modelList
  compare: kr-claude-haiku-4-5-20251001  # small second call that picks before/after images

# Version notes from the stores: catches design changes nobody announces. A new version whose notes
# mention design words (redesign, new look, layout...) goes to the model like a news item.
stores:
  app_store: true
  google_play: true
  country: us

gemini:
  curate: gemini-3.8-flash    # free tier; see ai.google.dev/gemini-api/docs/pricing

# Used when provider is anthropic.
models:
  curate: claude-sonnet-5-5   # the single filter-and-summarise call per run
  search: claude-haiku-5-5    # one web-search call per group below
  search_tool: web_search_20250305
  searches_per_group: 3       # max web searches the model may run per group
  max_candidates: 150         # cap on items sent to the curate call

# USD per million tokens, used only to log an estimated cost per run.
# Check https://www.anthropic.com/pricing if these change.
prices:
  claude-sonnet-5-5: { input: 3, output: 15 }
  claude-haiku-5-5: { input: 1, output: 5 }
  gemini-3.8-flash: { input: 0, output: 0 }   # free tier; wrong if billing is turned on for the key's project
  web_search_per_1000: 10

# The four groups are also the four categories on the page: ota, rail, platform, consumer.
# Per app:
#   aliases      words that mark a headline as being about this app. Whole words, exact
#                capitals, so "Threads" matches the app but not "email threads".
#   domains      the company's own sites; items from these count as first-party
#   appstore_id  App Store id: the icon, and version notes for "changes nobody announces" (optional)
#   play_id      Google Play package name, for version notes (optional)
#   icon_domain  use this site's favicon as the icon instead (optional)
groups:
  ota:
    label: OTAs
    search:
      - Expedia OR Booking.com OR Airbnb app new feature OR redesign
      - Agoda OR Hopper OR Klook OR Trip.com app launches new feature
      - Google Flights OR Google Hotels new feature
    apps:
      - name: Expedia
        aliases: [Expedia, Hotels.com, Vrbo]
        domains: [expediagroup.com, expedia.com]
        play_id: com.expedia.bookings
        appstore_id: 427916203
      - name: Booking.com
        aliases: [Booking.com, Booking Holdings]
        domains: [booking.com, bookingholdings.com]
        play_id: com.booking
        appstore_id: 367003839
      # Airbnb is also in your consumer list; it is tracked once, here.
      - name: Airbnb
        aliases: [Airbnb]
        domains: [airbnb.com, news.airbnb.com]
        play_id: com.airbnb.android
        appstore_id: 401626263
      - name: Agoda
        aliases: [Agoda]
        domains: [agoda.com]
        appstore_id: 440676901
        play_id: com.agoda.mobile.consumer
      - name: Google Travel
        aliases: [Google Flights, Google Travel, Google Hotels]
        domains: [blog.google]
        icon_domain: google.com
      - name: Hopper
        aliases: [Hopper]
        domains: [hopper.com]
        play_id: com.hopper.mountainview.play
        appstore_id: 904052407
      - name: Klook
        aliases: [Klook]
        domains: [klook.com]
        appstore_id: 961850126
        play_id: com.klook
      - name: Trip.com
        aliases: [Trip.com, Ctrip]
        domains: [trip.com, group.trip.com]
        play_id: ctrip.english
        appstore_id: 681752345
      - name: Kayak
        aliases: [KAYAK, Kayak]
        domains: [kayak.com]
        appstore_id: 305204535
        play_id: com.kayak.android
      - name: Tripadvisor
        aliases: [Tripadvisor, TripAdvisor]
        domains: [tripadvisor.com, tripadvisor.mediaroom.com]
        appstore_id: 284876795
        play_id: com.tripadvisor.tripadvisor

  rail:
    label: Rail and ground
    search:
      - Trainline OR Omio app new feature
      - JR East OR JR Central OR Shinkansen app booking new feature
    apps:
      - name: Trainline
        aliases: [Trainline]
        domains: [thetrainline.com, trainlinegroup.com]
        appstore_id: 334235181
        play_id: com.thetrainline
      - name: Omio
        aliases: [Omio]
        domains: [omio.com]
        appstore_id: 885372509
        play_id: com.goeuro.rosie
      - name: JR / Japan rail
        aliases: [JR East, JR West, JR Central, JR Kyushu, Eki-net, SmartEX, Shinkansen app]
        domains: [jreast.co.jp, jr-central.co.jp, westjr.co.jp, jrkyushu.co.jp]
        icon_domain: jreast.co.jp

  platform:
    label: Platforms
    search:
      - Apple iOS design OR Human Interface Guidelines update
      - Android OR Material Design new UI feature
    apps:
      - name: Apple
        aliases: [Apple, iOS, iPadOS, macOS, watchOS, visionOS, WWDC, Human Interface Guidelines, Liquid Glass, App Store]
        domains: [apple.com, developer.apple.com]
        icon_domain: apple.com
      - name: Google
        aliases: [Android, Material Design, Material 3, Material You, Pixel Drop, Gemini]
        domains: [android.com, android-developers.googleblog.com, blog.google, m3.material.io, material.io, design.google]
        icon_domain: android.com

  consumer:
    label: Consumer apps known for design
    search:
      - Duolingo OR Revolut OR Uber OR Spotify app redesign OR new feature
      - Instagram OR WhatsApp OR TikTok OR Threads new feature rolling out
      - Notion OR Linear new feature launch
    apps:
      - name: Duolingo
        aliases: [Duolingo]
        domains: [duolingo.com, blog.duolingo.com]
        play_id: com.duolingo
        appstore_id: 570060128
      - name: Revolut
        aliases: [Revolut]
        domains: [revolut.com]
        play_id: com.revolut.revolut
        appstore_id: 932493382
      - name: Uber
        aliases: [Uber]
        domains: [uber.com]
        play_id: com.ubercab
        appstore_id: 368677368
      - name: Spotify
        aliases: [Spotify]
        domains: [spotify.com, newsroom.spotify.com]
        play_id: com.spotify.music
        appstore_id: 324684580
      - name: Instagram
        aliases: [Instagram]
        domains: [about.instagram.com, about.fb.com, instagram.com]
        play_id: com.instagram.android
        appstore_id: 389801252
      - name: WhatsApp
        aliases: [WhatsApp]
        domains: [blog.whatsapp.com, whatsapp.com, about.fb.com]
        play_id: com.whatsapp
        appstore_id: 310633997
      - name: TikTok
        aliases: [TikTok]
        domains: [newsroom.tiktok.com, tiktok.com]
        play_id: com.zhiliaoapp.musically
        appstore_id: 835599320
      - name: Threads
        aliases: [Threads]
        domains: [about.fb.com, threads.com, threads.net]
        play_id: com.instagram.barcelona
        appstore_id: 6446901002
      - name: Notion
        aliases: [Notion]
        domains: [notion.com, notion.so]
        play_id: notion.id
        appstore_id: 1232780281
      - name: Linear
        aliases: [Linear app, Linear's, Linear launches, Linear adds]
        domains: [linear.app]
        appstore_id: 1645587184
        play_id: app.linear
        icon_domain: linear.app

# RSS/Atom feeds, read every run. These are the most trusted source.
#   kind: company  the company's own feed; every item is about `app`
#   kind: outlet   a news site; items about a watchlist app, or with design words in the headline
#                  (redesign, rebrand, new logo, interface, onboarding...), go to the model
#   kind: design   a design or branding publication; every item goes to the model, which names the brand
#   page: PATTERN  the url is a newsroom web page, not a feed: its links whose path matches PATTERN (a regular
#                  expression) are the articles, and each is read for its title, date and summary
# `npm run check-feeds` tests every URL below.
#
# Blocked for automated readers from the laptop's network (Nov 2026), even in a real Chrome: expedia.com (including
# its product release pages, expedia.com/product/release/...), Expedia Group's newsroom, Skyscanner, Omio, Trainline
# and PhocusWire. Their bigger releases reach the outlets below (Skift, The Verge, 9to5Mac, TechCrunch).
# Hopper's media center (media.hopper.com) reads fine but its articles carry no machine-readable date, so the
# 48-hour rule cannot check them; it is left out.
# X and LinkedIn have no free way to read posts (Nov 2026). Big design news posted there is usually
# picked up by the outlets and design publications below.
feeds:
  - name: Apple Developer News
    url: https://developer.apple.com/news/rss/news.rss
    kind: company
    app: Apple
  - name: Android Developers Blog
    url: https://feeds.feedburner.com/blogspot/hsDu
    kind: company
    app: Google
  - name: The Keyword (Android)
    url: https://blog.google/products/android/rss/
    kind: company
    app: Google
  - name: The Keyword (Travel)
    url: https://blog.google/products/travel/rss/
    kind: company
    app: Google Travel
  - name: Booking Holdings
    url: https://www.bookingholdings.com/feed/
    kind: company
    app: Booking.com
  - name: Booking.com Newsroom
    url: https://news.booking.com/feed/
    kind: company
    app: Booking.com
  - name: KAYAK News
    url: https://www.kayak.com/news/feed/
    kind: company
    app: Kayak
  - name: Tripadvisor Press
    url: https://tripadvisor.mediaroom.com/press-releases?pagetemplate=rss
    kind: company
    app: Tripadvisor
  # Newsrooms with no feed: the page itself is read, and links matching `page` are its articles.
  - name: Airbnb Newsroom
    url: https://news.airbnb.com/
    kind: company
    app: Airbnb
    page: '^/[a-z0-9]+(-[a-z0-9]+){2,}/?$'
  - name: Agoda Newsroom
    url: https://www.agoda.com/press/newsroom/
    kind: company
    app: Agoda
    page: '^/press/(?!agoda-in-the-news)[a-z0-9]+(-[a-z0-9]+){2,}/?$'
  - name: Trip.com Newsroom
    url: https://www.trip.com/newsroom/
    kind: company
    app: Trip.com
    page: '^/newsroom/[a-z0-9_-]{12,}/?$'
  - name: Meta Newsroom
    url: https://about.fb.com/news/feed/
    kind: outlet
  - name: Spotify Newsroom
    url: https://newsroom.spotify.com/feed/
    kind: company
    app: Spotify
  - name: Duolingo Blog
    url: https://blog.duolingo.com/rss/
    kind: company
    app: Duolingo
  - name: Linear Changelog
    url: https://linear.app/rss/changelog.xml
    kind: company
    app: Linear
  - name: Notion Releases
    url: https://www.notion.com/releases/rss.xml
    kind: company
    app: Notion
  - name: 9to5Mac
    url: https://9to5mac.com/feed/
    kind: outlet
  - name: 9to5Google
    url: https://9to5google.com/feed/
    kind: outlet
  - name: MacRumors
    url: https://feeds.macrumors.com/MacRumors-All
    kind: outlet
  - name: The Verge
    url: https://www.theverge.com/rss/index.xml
    kind: outlet
  - name: TechCrunch Apps
    url: https://techcrunch.com/category/apps/feed/
    kind: outlet
  - name: Skift
    url: https://skift.com/feed/
    kind: outlet
  - name: Apple Newsroom
    url: https://www.apple.com/newsroom/rss-feed.rss
    kind: company
    app: Apple

  # On medium.com, which is otherwise blocked; a feed's own posts skip the block.
  # The Airbnb, Uber, Spotify and Google Design Medium blogs were tried and left out: their newest
  # posts are 1 to 8 years old (Nov 2026), and their current sites have no feed.
  - name: Netflix Tech Blog
    url: https://medium.com/feed/netflix-techblog
    kind: outlet

  # Design and branding publications (UI, UX and brand news about any app, site or brand).
  # Not reachable from the laptop's network (Nov 2026): Brand New (underconsideration.com), Design Week,
  # Creative Review, Fast Company Co.Design. Designboom and Wallpaper work but are mostly
  # architecture and interiors, so they are left out.
  - name: It's Nice That
    url: https://www.itsnicethat.com/articles.rss
    kind: design
  - name: Dezeen
    url: https://www.dezeen.com/feed/
    kind: design
  - name: Dezeen (logos)
    url: https://www.dezeen.com/tag/logos/feed/
    kind: design
  - name: BP&O
    url: https://bpando.org/feed/
    kind: design
  - name: Logo Design Love
    url: https://www.logodesignlove.com/feed
    kind: design
  - name: PRINT
    url: https://www.printmag.com/feed/
    kind: design
  - name: Sidebar
    url: https://sidebar.io/feed.xml
    kind: design
  - name: Figma Blog
    url: https://www.figma.com/blog/feed/atom.xml
    kind: design
  - name: Creative Bloq
    url: https://www.creativebloq.com/feeds/all
    kind: design
  - name: Creative Boom
    url: https://www.creativeboom.com/feed/
    kind: design

# What counts as a reputable source.
trust:
  # News sites whose reporting is trusted. Search results from any other site are dropped
  # unless they come from the app's own domains above.
  outlets:
    - 9to5mac.com
    - 9to5google.com
    - macrumors.com
    - phocuswire.com
    - skift.com
    - theverge.com
    - techcrunch.com
    - engadget.com
    - arstechnica.com
    - wired.com
    - androidpolice.com
    - androidauthority.com
    - appleinsider.com
    - macstories.net
    - travelweekly.com
    - businesstravelnews.com
    - railway-technology.com
    - railjournal.com
    - nikkei.com
    - japantimes.co.jp
    - reuters.com
    - bloomberg.com
    - cnbc.com
    - theinformation.com
    - socialmediatoday.com
    - itsnicethat.com
    - dezeen.com
    - bpando.org
    - logodesignlove.com
    - printmag.com
    - sidebar.io
    - underconsideration.com
    - creativebloq.com
    - creativeboom.com
  # Never kept, whatever the content.
  blocked_domains:
    - medium.com
    - dribbble.com
    - behance.net
    - figma.com/community   # community redesign concepts; the Figma blog itself is fine
    - uxplanet.org
    - uxdesign.cc
    - wabetainfo.com
    - reddit.com
    - x.com
    - twitter.com
    - youtube.com
  # Headlines containing any of these (as whole words) are dropped before the model sees them.
  # Keep them specific: "shares" alone would also drop "Apple shares new design guidance".
  drop_words:
    - funding
    - funding round
    - earnings
    - quarterly results
    - revenue
    - stock price
    - shares fall
    - shares rise
    - investors
    - IPO
    - acquires
    - acquisition
    - appoints
    - hires
    - hiring
    - layoffs
    - lawsuit
    - sues
    - antitrust
    - rumor
    - rumors
    - rumour
    - leak
    - leaks
    - leaked
    - reportedly
    - best deals
    - deals
    - discount
    - "% off"
    - best apps
    - case study
    - redesign concept
